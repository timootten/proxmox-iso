name: Build Proxmox ISO

on:
  workflow_dispatch:
    inputs:
      pve_iso:
        description: 'Proxmox ISO file name, or "latest"'
        default: 'latest'
      target:
        description: 'vps = one virtual disk, ext4 + LVM. baremetal = physical server, ZFS'
        type: choice
        options: [vps, baremetal]
        default: 'vps'
      fqdn:
        description: 'Hostname with domain (empty = config/server.env)'
        default: ''
      network_mode:
        description: 'dhcp or static'
        type: choice
        options: [dhcp, static]
        default: 'dhcp'
      ip_cidr:
        description: 'static only, for example 192.0.2.10/24'
        default: ''
      gateway:
        description: 'static only'
        default: ''
      disk_list:
        description: 'Disks, space separated (empty = config/server.env). Example baremetal: nvme0n1 nvme1n1'
        default: ''
      zfs_raid:
        description: 'baremetal only: ZFS layout'
        type: choice
        options: [raid1, raid0, raid10, raidz-1, raidz-2, raidz-3]
        default: 'raid1'
      templates:
        description: 'VM templates from the Proxmox-Termplate-Generator repo (configs/<name>.conf), space separated. "none" = skip, empty = config/server.env'
        default: ''
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', '.github/workflows/build-iso.yml']
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: read

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg git xorriso jq openssl
          curl -fsSL https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
            -o /usr/share/keyrings/proxmox-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] http://download.proxmox.com/debian/pve trixie pve-no-subscription" \
            > /etc/apt/sources.list.d/pve.list
          apt-get update
          apt-get install -y --no-install-recommends proxmox-auto-install-assistant

      - uses: actions/checkout@v7

      - name: Build ISO
        env:
          PVE_ISO: ${{ inputs.pve_iso }}
          TARGET: ${{ inputs.target }}
          FQDN: ${{ inputs.fqdn }}
          NETWORK_MODE: ${{ inputs.network_mode }}
          IP_CIDR: ${{ inputs.ip_cidr }}
          GATEWAY: ${{ inputs.gateway }}
          DISK_LIST: ${{ inputs.disk_list }}
          ZFS_RAID: ${{ inputs.zfs_raid }}
          TEMPLATES: ${{ inputs.templates }}
        run: ./scripts/build-iso.sh

      - uses: actions/upload-artifact@v7
        with:
          name: iso
          path: |
            out/proxmox-ve-auto.iso
            out/proxmox-ve-auto.iso.sha256
            out/build-info.env
          compression-level: 0
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: out

      - name: Publish release "latest"
        run: |
          set -euo pipefail
          . out/build-info.env
          cat > notes.md <<NOTES
          Unattended Proxmox VE installer.

          | | |
          |---|---|
          | Source | $PVE_ISO |
          | Target | $TARGET |
          | Network | $NETWORK_MODE |
          | Hostname | $FQDN |
          | Built | $(date -u +'%Y-%m-%d %H:%M UTC') |
          | Commit | ${GITHUB_SHA::7} |

          Login is by SSH key only. Set a password with \`passwd\` to use the web interface.
          The repository is private, get a short-lived download URL with \`scripts/download-url.sh\`.
          NOTES
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" --title "Proxmox VE auto-install ISO" --notes-file notes.md --latest
          gh release edit latest --repo "$GITHUB_REPOSITORY" --notes-file notes.md --latest
          gh release upload latest out/proxmox-ve-auto.iso out/proxmox-ve-auto.iso.sha256 --repo "$GITHUB_REPOSITORY" --clobber

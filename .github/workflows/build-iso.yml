name: Build Proxmox ISO

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Server type: vps = one virtual disk (ext4 + LVM), baremetal = physical server (ZFS)'
        type: choice
        options: [vps, baremetal]
        default: 'vps'
      fqdn:
        description: 'Hostname with domain, for example pve.example.com (empty = config/server.env)'
        default: ''
      ip_cidr:
        description: 'IPv4 address with prefix, for example 192.0.2.10/24. Leave empty for an IPv6-only server'
        default: ''
      gateway:
        description: 'IPv4 gateway'
        default: ''
      ipv6_cidr:
        description: 'IPv6 address with prefix, for example 2001:db8::10/64. Leave empty for an IPv4-only server'
        default: ''
      ipv6_gateway:
        description: 'IPv6 gateway'
        default: ''
      disk_list:
        description: 'baremetal: disks for ZFS, space separated, for example "nvme0n1 nvme1n1". vps: empty = sda'
        default: ''
      zfs_raid:
        description: 'baremetal: ZFS layout'
        type: choice
        options: [raid1, raid0, raid10, raidz-1, raidz-2, raidz-3]
        default: 'raid1'
      private_net_cidr:
        description: 'Private network for VMs (vmbr1): host address with prefix. "none" = no private network (empty = config/server.env)'
        default: ''
      mgmt_allowed:
        description: 'Firewall: only these addresses may reach SSH and the web interface, space separated CIDRs (empty = no firewall)'
        default: ''
      template_set:
        description: 'VM templates built on the first boot'
        type: choice
        options: [minimal, none, standard, all]
        default: 'minimal'
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', 'templates/**', '.github/workflows/build-iso.yml']
  pull_request:
    paths: ['scripts/**', 'config/**', 'templates/**', '.github/workflows/build-iso.yml']
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck scripts/*.sh
          shellcheck --severity=error templates/generate-template.sh templates/motd.sh

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        name: Is a new build needed?
        run: |
          needed=true
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && ! grep -qE '^(IP_CIDR|IPV6_CIDR)=.+' config/server.env; then
            echo "::notice::config/server.env has no IP_CIDR or IPV6_CIDR. Automatic builds are skipped, start a manual run."
            needed=false
          fi
          if [ "$needed" = "true" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            latest=$(curl -fsSL https://download.proxmox.com/iso/ | grep -oE 'proxmox-ve_[0-9]+\.[0-9]+-[0-9]+\.iso' | sort -uV | tail -1)
            current=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -oE 'proxmox-ve_[0-9]+\.[0-9]+-[0-9]+\.iso' | head -1 || true)
            echo "Proxmox latest: $latest, in our latest release: ${current:-none}"
            [ "$latest" = "$current" ] && needed=false
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, plan]
    if: needs.plan.outputs.needed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: ./scripts/install-tools.sh
      - name: Build ISO
        env:
          TARGET: ${{ inputs.target }}
          FQDN: ${{ inputs.fqdn }}
          IP_CIDR: ${{ inputs.ip_cidr }}
          GATEWAY: ${{ inputs.gateway }}
          IPV6_CIDR: ${{ inputs.ipv6_cidr }}
          IPV6_GATEWAY: ${{ inputs.ipv6_gateway }}
          DISK_LIST: ${{ inputs.disk_list }}
          ZFS_RAID: ${{ inputs.zfs_raid }}
          PRIVATE_NET_CIDR: ${{ inputs.private_net_cidr }}
          MGMT_ALLOWED: ${{ inputs.mgmt_allowed }}
          TEMPLATE_SET: ${{ inputs.template_set }}
        run: ./scripts/build-iso.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: |
            out/proxmox-ve-auto.iso
            out/proxmox-ve-auto.iso.sha256
            out/build-info.env
          compression-level: 0
          retention-days: 1

  release:
    needs: [plan, build]
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: out

      - name: Publish release
        run: |
          set -euo pipefail
          . out/build-info.env
          VER=$(echo "$PVE_ISO" | sed -E 's/proxmox-ve_(.*)\.iso/\1/')
          TAG="iso-${VER}-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<NOTES
          Unattended Proxmox VE installer.

          | | |
          |---|---|
          | Source | $PVE_ISO |
          | Target | $TARGET |
          | Hostname | $FQDN |
          | Templates | ${TEMPLATE_LIST:-none} |
          | Built | $(date -u +'%Y-%m-%d %H:%M UTC') |
          | Commit | ${GITHUB_SHA::7} |

          Login is by SSH key only. Set a password with \`passwd\` to use the web interface.
          The repository is private, get a short-lived download URL with \`scripts/download-url.sh\`.
          NOTES
          gh release create "$TAG" out/proxmox-ve-auto.iso out/proxmox-ve-auto.iso.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Proxmox VE $VER ($TARGET, build $GITHUB_RUN_NUMBER)" \
            --notes-file notes.md --latest

          # Keep the five newest ISO releases
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^iso-' | tail -n +6 \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

          URL=$(./scripts/download-url.sh "$GITHUB_REPOSITORY" "$TAG")
          {
            echo "## ISO ready: $TAG"
            echo
            echo "Direct download URL (valid for about one hour). Paste it into the ISO import of your hosting panel:"
            echo
            echo '```'
            echo "$URL"
            echo '```'
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 out/proxmox-ve-auto.iso.sha256)\`"
            echo
            echo "A new URL at any time: \`./scripts/download-url.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"

  alert:
    needs: [lint, plan, build, release]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Scheduled ISO build failed ($(date -u +%F))" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

name: Build Proxmox ISO

# Only runs when you start it by hand ("Run workflow"). Nothing builds automatically.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Server type: vps = one virtual disk (ext4 + LVM), baremetal = physical server (ZFS)'
        type: choice
        options: [vps, baremetal]
        default: 'vps'
      fqdn:
        description: 'Hostname with domain'
        default: 'hydrogen.timootten.com'
      ip_cidr:
        description: 'IPv4 address with prefix, for example 192.0.2.10/24. Leave empty for an IPv6-only server'
        default: ''
      gateway:
        description: 'IPv4 gateway'
        default: ''
      ipv6_cidr:
        description: 'IPv6 address with prefix, for example 2001:db8::10/64. Leave empty for an IPv4-only server'
        default: ''
      ipv6_gateway:
        description: 'IPv6 gateway'
        default: ''
      disk_list:
        description: 'baremetal: disks for ZFS, space separated, for example "nvme0n1 nvme1n1". vps: empty = sda'
        default: ''
      zfs_raid:
        description: 'baremetal: ZFS layout'
        type: choice
        options: [raid1, raid0, raid10, raidz-1, raidz-2, raidz-3]
        default: 'raid1'
      private_net_cidr:
        description: 'Private network for VMs (vmbr1): host address with prefix. "none" = no private network (empty = config/server.env)'
        default: ''
      mgmt_allowed:
        description: 'Firewall: only these addresses may reach SSH and the web interface, space separated CIDRs (empty = no firewall)'
        default: ''
      template_set:
        description: 'VM templates built on the first boot'
        type: choice
        options: [minimal, none, standard, all]
        default: 'minimal'

permissions:
  contents: read

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: ./scripts/install-tools.sh

      - name: Build ISO
        env:
          TARGET: ${{ inputs.target }}
          FQDN: ${{ inputs.fqdn }}
          IP_CIDR: ${{ inputs.ip_cidr }}
          GATEWAY: ${{ inputs.gateway }}
          IPV6_CIDR: ${{ inputs.ipv6_cidr }}
          IPV6_GATEWAY: ${{ inputs.ipv6_gateway }}
          DISK_LIST: ${{ inputs.disk_list }}
          ZFS_RAID: ${{ inputs.zfs_raid }}
          PRIVATE_NET_CIDR: ${{ inputs.private_net_cidr }}
          MGMT_ALLOWED: ${{ inputs.mgmt_allowed }}
          TEMPLATE_SET: ${{ inputs.template_set }}
        run: ./scripts/build-iso.sh

      - name: Publish release
        run: |
          set -euo pipefail
          . out/build-info.env
          VER=$(echo "$PVE_ISO" | sed -E 's/proxmox-ve_(.*)\.iso/\1/')
          TAG="iso-${VER}-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<NOTES
          Unattended Proxmox VE installer.

          | | |
          |---|---|
          | Source | $PVE_ISO |
          | Target | $TARGET |
          | Hostname | $FQDN |
          | Templates | ${TEMPLATE_LIST:-none} |
          | Built | $(date -u +'%Y-%m-%d %H:%M UTC') |
          | Commit | ${GITHUB_SHA::7} |

          Login is by SSH key only. Set a password with \`passwd\` to use the web interface.
          The repository is private, get a short-lived download URL with \`scripts/download-url.sh\`.
          NOTES
          gh release create "$TAG" out/proxmox-ve-auto.iso out/proxmox-ve-auto.iso.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Proxmox VE $VER ($TARGET, build $GITHUB_RUN_NUMBER)" \
            --notes-file notes.md --latest

          # Keep the five newest ISO releases
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^iso-' | tail -n +6 \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

          URL=$(NO_VERIFY=1 ./scripts/download-url.sh "$GITHUB_REPOSITORY" "$TAG") || URL=""
          echo "Download URL: $URL"
          {
            echo "## ISO ready: $TAG"
            echo
            if [ -n "$URL" ]; then
              echo "Direct download URL (valid for about one hour). Paste it into the ISO import of your hosting panel."
              echo "If the import reports the file as unavailable, wait one or two minutes: GitHub needs a moment after the upload."
              echo
              echo '```'
              echo "$URL"
              echo '```'
            else
              echo "The ISO is published, but no download URL could be created. Run \`./scripts/download-url.sh\` on your computer."
            fi
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 out/proxmox-ve-auto.iso.sha256)\`"
            echo
            echo "A new URL at any time: \`./scripts/download-url.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"

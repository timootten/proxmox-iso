#!/bin/bash
#
# Global Configuration for Proxmox Template Generator
# These settings apply to all templates unless overridden in individual configs
#

# ============================================================================
# STORAGE & NETWORK DEFAULTS
# ============================================================================

# Default storage pool for VM disks
DEFAULT_STORAGE="${DEFAULT_STORAGE:-local}"

# Default network bridge
DEFAULT_BRIDGE="${DEFAULT_BRIDGE:-vmbr0}"

# ============================================================================
# BRANDING (used by the dynamic MOTD, see motd.sh)
# ============================================================================

# Optional links shown in the MOTD. Empty = not shown.
BRAND_DOCS_URL="${BRAND_DOCS_URL:-}"
BRAND_SUPPORT_URL="${BRAND_SUPPORT_URL:-}"

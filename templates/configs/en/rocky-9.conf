#!/bin/bash
#
# Rocky Linux 9 Template Configuration
#

# VM Configuration
VM_ID=8209
VM_NAME="rocky-9-template-en"
VM_MEMORY=2048
VM_CORES=2
VM_SOCKETS=1
VM_DISK_SIZE="10G"

# VM Hardware (Performance Optimizations)
VM_MACHINE="q35"
VM_BIOS="ovmf"
VM_CPU_TYPE="host"
VM_SCSI_CONTROLLER="virtio-scsi-single"
VM_DISK_CACHE="writeback"
VM_DISK_IOTHREAD="1"
VM_DISK_SSD="1"
VM_DISK_DISCARD="on"

# Distribution
DISTRO="rocky"
VERSION="9"
ARCH="x86_64"
IMAGE_URL="https://download.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2"

# Cloud-Init Settings
CLOUD_INIT_USER="root"

# System Settings
TIMEZONE="UTC"
KEYBOARD_LAYOUT="us"
KEYBOARD_MODEL="pc105"
LOCALE="en_US.UTF-8"
LANGUAGE="en_US:en"

# Your custom PS1 prompt (colorized)
CUSTOM_PS1='\[\e[38;5;1m\]\u\[\e[38;5;7m\]@\[\e[38;5;14m\]\h \[\e[38;5;11m\]\w \[\033[0m\]$ '

# Extra packages to install (space-separated)
EXTRA_PACKAGES=""

# Post-install commands (optional)
POST_INSTALL_CMD1=""
POST_INSTALL_CMD2=""
POST_INSTALL_CMD3=""
POST_INSTALL_CMD4=""
POST_INSTALL_CMD5=""

# Cloud-Init: Auto-update on every boot
CLOUD_INIT_AUTO_UPDATE=true

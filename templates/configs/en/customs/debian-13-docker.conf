# Debian 13 Docker/Container Host Template
# Optimized for running Docker containers and Kubernetes on Debian 13 Trixie

# VM Configuration
VM_ID=8901
VM_NAME="debian-13-docker-template-en"
VM_MEMORY=4096                # Good for multiple containers
VM_CORES=2                  
VM_SOCKETS=1
VM_STORAGE="local-zfs"
VM_BRIDGE="gnet"
VM_DISK_SIZE="10G"          

# VM Hardware (Performance for Containers)
VM_MACHINE="q35"              # Modern chipset with PCIe
VM_BIOS="ovmf"                # UEFI for fast boot
VM_CPU_TYPE="host"            # Host CPU features (important for containers)
VM_SCSI_CONTROLLER="virtio-scsi-single"
VM_DISK_CACHE="writeback"     # Fast disk access
VM_DISK_IOTHREAD="1"          # Important for container I/O
VM_DISK_SSD="1"               # SSD emulation
VM_DISK_DISCARD="on"          # Thin provisioning (important for docker)

# Cloud Image
IMAGE_URL="https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
CLOUD_INIT_USER="root"

# System
TIMEZONE="UTC"
KEYBOARD_LAYOUT="us"
KEYBOARD_MODEL="pc105"
LOCALE="en_US.UTF-8"
LANGUAGE="en_US:en"

# Docker and container tools (install via official Docker installer)
EXTRA_PACKAGES="git curl wget vim htop iotop bridge-utils net-tools ca-certificates gnupg"

# Docker installation and optimizations
POST_INSTALL_CMD1="curl -fsSL https://get.docker.com -o /tmp/get-docker.sh"
POST_INSTALL_CMD2="sh /tmp/get-docker.sh"
POST_INSTALL_CMD3="rm -f /tmp/get-docker.sh"
POST_INSTALL_CMD4="mkdir -p /etc/docker && echo '{\"log-driver\":\"json-file\",\"log-opts\":{\"max-size\":\"10m\",\"max-file\":\"3\"}}' > /etc/docker/daemon.json"

# Custom PS1 (Docker Theme - Blue with whale emoji)
CUSTOM_PS1='\[\e[38;5;33m\]\u\[\e[38;5;7m\]@\[\e[38;5;39m\]\h \[\e[38;5;12m\]\w \[\033[0m\]🐳 '

# Cloud-Init
CLOUD_INIT_AUTO_UPDATE=true

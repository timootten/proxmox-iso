#!/bin/bash
#
# Debian 13 (Trixie) Template Configuration
#

# VM Configuration
VM_ID=8013
VM_NAME="debian-13-template-en"
VM_MEMORY=2048
VM_CORES=2
VM_SOCKETS=1
VM_DISK_SIZE="10G"

# VM Hardware (Performance Optimizations)
VM_MACHINE="q35"              # Modern chipset with PCIe support
VM_BIOS="ovmf"                # UEFI for faster boot
VM_CPU_TYPE="host"            # Pass-through all host CPU features
VM_SCSI_CONTROLLER="virtio-scsi-single"
VM_DISK_CACHE="writeback"     # Fastest (safe with qemu-guest-agent)
VM_DISK_IOTHREAD="1"          # Offload I/O to separate thread
VM_DISK_SSD="1"               # Enable SSD emulation (TRIM support)
VM_DISK_DISCARD="on"          # Enable discard for thin provisioning

# Distribution
DISTRO="debian"
VERSION="13"
ARCH="amd64"
IMAGE_URL="https://cdimage.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"

# Cloud-Init Settings
CLOUD_INIT_USER="root"

# System Settings
TIMEZONE="UTC"
KEYBOARD_LAYOUT="us"
KEYBOARD_MODEL="pc105"
LOCALE="en_US.UTF-8"
LANGUAGE="en_US:en"

# Your custom PS1 prompt (colorized)
CUSTOM_PS1='\[\e[38;5;1m\]\u\[\e[38;5;7m\]@\[\e[38;5;14m\]\h \[\e[38;5;11m\]\w \[\033[0m\]$ '

# Extra packages to install (space-separated)
# Example: EXTRA_PACKAGES="vim htop curl git"
EXTRA_PACKAGES="fastfetch"

# Post-install commands (optional, run during image customization)
POST_INSTALL_CMD1=""
POST_INSTALL_CMD2=""
POST_INSTALL_CMD3=""
POST_INSTALL_CMD4=""
POST_INSTALL_CMD5=""

# Cloud-Init: Auto-update on every boot (recommended for templates)
# This runs 'apt update && apt upgrade -y' on first boot via cloud-init
CLOUD_INIT_AUTO_UPDATE=true

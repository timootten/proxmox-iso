#!/bin/bash
#
# Ubuntu 22.04 LTS (Jammy Jellyfish) Template Configuration
#

# VM Configuration
VM_ID=9122
VM_NAME="ubuntu-22.04-template-de"
VM_MEMORY=2048
VM_CORES=2
VM_SOCKETS=1
VM_DISK_SIZE="10G"

# VM Hardware (Performance Optimizations)
VM_MACHINE="q35"
VM_BIOS="ovmf"
VM_CPU_TYPE="host"
VM_SCSI_CONTROLLER="virtio-scsi-single"
VM_DISK_CACHE="writeback"
VM_DISK_IOTHREAD="1"
VM_DISK_SSD="1"
VM_DISK_DISCARD="on"

# Distribution
DISTRO="ubuntu"
VERSION="22.04"
ARCH="amd64"
IMAGE_URL="https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"

# Cloud-Init Settings
CLOUD_INIT_USER="root"

# System Settings
TIMEZONE="Europe/Berlin"
KEYBOARD_LAYOUT="de"
KEYBOARD_MODEL="pc105"
LOCALE="de_DE.UTF-8"
LANGUAGE="de_DE:de"

# Your custom PS1 prompt (colorized)
CUSTOM_PS1='\[\e[38;5;1m\]\u\[\e[38;5;7m\]@\[\e[38;5;14m\]\h \[\e[38;5;11m\]\w \[\033[0m\]$ '

# Extra packages to install (space-separated)
EXTRA_PACKAGES=""

# Post-install commands (optional)
POST_INSTALL_CMD1=""
POST_INSTALL_CMD2=""
POST_INSTALL_CMD3=""
POST_INSTALL_CMD4=""
POST_INSTALL_CMD5=""

# Cloud-Init: Auto-update on every boot
CLOUD_INIT_AUTO_UPDATE=true

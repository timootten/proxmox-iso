# Static routes, applied at every boot by static-routes.service (ip route replace).
# One route per line, the syntax is the one of "ip route". Prefix a line with "-6 " for IPv6.
# After the installation the file lives at /etc/proxmox-static-routes.conf,
# change it there and run: systemctl restart static-routes
#
# Examples:
#   10.10.0.0/24 via 10.0.0.1 dev vmbr0
#   5.175.223.72/32 dev vmbr1
#   -6 2001:db8:1::/64 dev vmbr1
